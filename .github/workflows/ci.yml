name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aguateria_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aguateria_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: development
      APP_TIMEZONE: America/Asuncion
      AUTH_SECRET: ci-only-not-a-production-secret-01234567
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aguateria_db
      DATABASE_SSL: "false"
      STORAGE_DRIVER: local
      ALLOW_DEV_SEED: "true"
      DEV_ADMIN_EMAIL: admin@aguateria.local
      DEV_ADMIN_PASSWORD: ChangeMe_DevOnly_1
      CRON_SECRET: ci-cron-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test
      - run: npm run build
